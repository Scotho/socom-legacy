name: Claim a lane
description: Take ownership of an area from the README's "Calling for owners & contributors"
title: "Owner: "
labels: ["lane"]
body:
  - type: dropdown
    id: lane
    attributes:
      label: Which lane
      options:
        - Campaign missions & co-op
        - Creator tooling & the Forge
        - Maps, models & community content
        - Competitive infrastructure
        - Other languages
        - Cross-play with emulators
        - Community hosting
        - Server & performance
        - Anti-cheat
        - Something else
    validations:
      required: true
  - type: textarea
    id: first
    attributes:
      label: What you'd take on first
      description: A first, small piece you can finish. We'll help you scope it.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: A little about you
      description: What you've built before, and what you'd like help with. Optional.
